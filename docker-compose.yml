services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: syncspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env file}
      POSTGRES_DB: syncspace
    ports:
      - "5432:5432"
    volumes:
      - syncspace-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncspace -d syncspace"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://syncspace:syncspace-local-only@postgres:5432/syncspace
      WEB_ORIGIN: http://localhost:3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped

volumes:
  syncspace-postgres:
