services:
  - type: web
    name: syncspace-resume-demo
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: WEB_ORIGIN
        fromService:
          type: web
          name: syncspace-resume-demo
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        sync: false
